[package]
name = "fetch-happen"
version = "0.5.0"
edition = "2021"
description = "A comfortable wrapper for the javascript 'fetch' api, with a native reqwest fallback."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
examples = []

[dependencies]
abort-signal = { path = "abort-signal" }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The native transport: same API, streaming reqwest under the hood.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = "0.13"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "time", "sync"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
  "console",
  "AbortController",
  "AbortSignal",
  "ReadableStream",
  "ReadableStreamDefaultReader",
]

[workspace]
members = ["abort-signal"]
